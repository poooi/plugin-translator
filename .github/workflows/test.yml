name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: npm

    - name: Install deps
      run: |
        npm ci

    - name: Test
      run: |
        npm run lint
        npm run typecheck
        npm test

    - name: Check content updates
      run: |
        npx ts-node update.ts
