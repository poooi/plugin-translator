name: Update translations

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: npm

      - name: Install deps
        run: npm ci

      # update.ts exits with code 1 when translation files changed,
      # so capture the exit code instead of failing the job here
      - name: Fetch translation updates
        id: update
        run: |
          set +e
          npx ts-node update.ts
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.update.outputs.exit_code }}" != "0" ]; then
            echo "update.ts failed without producing changes"
            exit 1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates and bump minor version
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update translations"
          npm version minor
          git push --follow-tags

      # trusted publishing (OIDC) requires npm >= 11.5.1, which needs Node >= 20.17
      - name: Use Node.js 24.x for publishing
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Publish to npm
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm install -g npm@latest
          npm publish
